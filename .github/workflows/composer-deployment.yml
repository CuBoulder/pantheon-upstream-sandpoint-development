name: Deploy New Development Build

on: 
  workflow_dispatch:
    inputs:
      run_composer:
        description: 'Run composer updates?'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Update and Deploy Developer Sandbox
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Include PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Update composer files
        if: ${{ inputs.run_composer }}
        run: |
          echo "::group::Composer update #1"
          composer update
          echo "::endgroup::"

          echo "::group::Update upstream dependencies"
          composer update-upstream-dependencies
          echo "::endgroup::"

          echo "::group::Composer update #2"
          composer update
          echo "::endgroup::"

      - name: Push changes back to repo
        if: ${{ inputs.run_composer }}
        id: commit
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected. Skipping deployment."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config --global user.email "noreply@github.com"
          git config --global user.name "GitHub Actions"

          DATE=$(date +"%d-%m-%Y-%T")

          git commit -m "Workflow deployment — $DATE"
          git push origin main

          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Required to run drush commands
      - name: Load Pantheon SSH key
        # if: steps.commit.outputs.changed == 'true'
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      
      - name: Install Terminus
        # if: steps.commit.outputs.changed == 'true'
        uses: pantheon-systems/terminus-github-actions@v1
        with:
          pantheon-machine-token: ${{ secrets.TERMINUS_TOKEN }}
          terminus-version: 4.3.3

      - name: Deploy updates to Pantheon
        id: deploy
        # if: steps.commit.outputs.changed == 'true'
        run: |
          echo "Deploying updates to ${{ vars.SANDBOX_SITE_NAME }}"

          terminus env:wake ${{ vars.SANDBOX_SITE_NAME }}.live
          terminus site:upstream:clear-cache ${{ vars.SANDBOX_SITE_NAME }}

          terminus upstream:updates:apply ${{ vars.SANDBOX_SITE_NAME }}.dev --accept-upstream

          terminus env:deploy ${{ vars.SANDBOX_SITE_NAME }}.test --yes
          terminus env:deploy ${{ vars.SANDBOX_SITE_NAME }}.live --yes --updatedb --cc

          terminus remote:drush ${{ vars.SANDBOX_SITE_NAME }}.live -- cr

          echo "::group::Features import"
          terminus remote:drush ${{ vars.SANDBOX_SITE_NAME }}.live -- features:import cu_boulder_content_types --yes
          echo "::endgroup::"

          echo "::group::Config import from profile"
          terminus remote:drush ${{ vars.SANDBOX_SITE_NAME }}.live -- config:import --partial --source=/code/web/profiles/custom/boulder_profile/config/install --yes
          echo "::endgroup::"

          echo "::group::Database update"
          terminus remote:drush ${{ vars.SANDBOX_SITE_NAME }}.live -- updb --yes
          echo "::endgroup::"

          terminus remote:drush ${{ vars.SANDBOX_SITE_NAME }}.live -- cr